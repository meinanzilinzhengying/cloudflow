# =============================================================================
# CloudFlow eBPF Agent 配置文件
# =============================================================================

# -----------------------------------------------------------------------------
# 平台服务连接配置
# -----------------------------------------------------------------------------

# 控制平面 gRPC 地址
control_plane_addr: "127.0.0.1:9001"

# 数据平面 gRPC 地址
data_plane_addr: "127.0.0.1:9002"

# Kafka 消息队列地址（可选，用于高吞吐场景）
kafka_addr: ""
kafka_topic: "cloudflow-metrics"

# 上报认证 Token
agent_token: ""

# -----------------------------------------------------------------------------
# eBPF 采集配置
# -----------------------------------------------------------------------------
bpf:
  # eBPF 后端选择
  #   - auto:    自动检测（优先 libbpf，失败回退 cilium）
  #   - libbpf:  C 语言后端（推荐，国产芯片兼容性更好）
  #   - cilium:  Go 原生后端（开发体验更好）
  backend: "auto"

  # 流量采集网卡（留空表示采集所有网卡）
  mgmt_iface: ""

  # 功能开关
  enable_tcp_metrics: true     # TCP 深度指标（延迟、重传、零窗口）
  enable_http_metrics: true    # HTTP 请求指标（方法、路径、状态码）
  enable_http_full: false      # HTTP 全字段解析（请求头、响应头、Body）
  enable_dns_full: false       # DNS 全字段解析（查询域名、响应记录）
  enable_mysql_full: false     # MySQL 全字段解析（SQL 语句、执行时间）

  # eBPF Map 大小配置
  map_size:
    network_flow: 65536
    tcp_stats: 32768
    http_stats: 16384
    dns_queries: 8192

# -----------------------------------------------------------------------------
# 数据上报配置
# -----------------------------------------------------------------------------
report:
  # 上报间隔
  interval: "5s"

  # 批量上报大小
  batch_size: 1000

  # 队列大小（超过则丢弃）
  queue_size: 10000

  # 上报超时时间
  timeout: "10s"

  # 重试次数
  retry_count: 3

  # 重试间隔
  retry_interval: "1s"

# -----------------------------------------------------------------------------
# Prometheus 指标服务
# -----------------------------------------------------------------------------
metrics:
  # 是否启用指标服务
  enabled: true

  # 监听地址
  addr: ":9090"

  # 健康检查端点
  health_path: "/healthz"

  # 指标端点
  metrics_path: "/metrics"

# -----------------------------------------------------------------------------
# 日志配置
# -----------------------------------------------------------------------------
logging:
  # 日志级别: debug / info / warn / error
  level: "info"

  # 日志格式: json / text
  format: "json"

  # 输出方式: stdout / file / both
  output: "both"

  # 日志文件路径（output 为 file/both 时生效）
  file_path: "/opt/cloudflow/agent/logs/agent.log"

  # 日志文件最大大小（MB）
  max_size: 100

  # 日志文件保留天数
  max_age: 7

  # 日志文件保留个数
  max_backups: 10

# -----------------------------------------------------------------------------
# 心跳配置
# -----------------------------------------------------------------------------
heartbeat:
  # 心跳间隔
  interval: "30s"

  # 超时时间（超过则重新注册）
  timeout: "90s"

  # Agent 元数据
  metadata:
    hostname: ""           # 自动获取
    ip_address: ""         # 自动获取
    region: ""
    zone: ""
    env: "production"
