apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudflow-agent
  labels:
    app: cloudflow-agent
rules:
  # 必需权限
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  
  # 推荐权限 - 增强功能
  - apiGroups: [""]
    resources: ["services", "endpoints", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
  
  # 可选权限 - 日志关联
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudflow-agent
  labels:
    app: cloudflow-agent
subjects:
  - kind: ServiceAccount
    name: cloudflow-agent
    namespace: cloudflow
roleRef:
  kind: ClusterRole
  name: cloudflow-agent
  apiGroup: rbac.authorization.k8s.io
