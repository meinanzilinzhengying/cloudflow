worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server_tokens off;
    client_max_body_size 50m;

    # ============================================================
    # 公共反代设置 - 允许 iframe 嵌入
    # 去掉上游的 X-Frame-Options 和 CSP，替换为允许嵌入的版本
    # ============================================================
    map $upstream_http_x_frame_options $xfo {
        "" "";
        default "SAMEORIGIN";
    }

    server {
        listen       80;
        server_name  localhost;

        # 关键修复: 使用相对路径重定向
        # 避免 Location: http://localhost/proxy/grafana/login (用户浏览器跳到自己机器)
        # 改为 Location: /proxy/grafana/login (浏览器相对当前 origin 解析)
        absolute_redirect off;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # ============================================================
        # Grafana 反代
        # 关键修复:
        #   1. proxy_hide_header 去掉 X-Frame-Options: deny
        #   2. proxy_redirect 处理子路径跳转 (/login -> /proxy/grafana/login)
        #   3. sub_filter 改写 HTML 内的绝对路径链接
        # ============================================================
        location /proxy/grafana/ {
            proxy_pass http://cloudflow-grafana:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # 允许 iframe 嵌入 - 去掉上游安全限制头
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Content-Security-Policy "frame-ancestors 'self' *" always;

            # 重定向路径改写: 上游返回 Location: /login → 变成 Location: /proxy/grafana/login
            proxy_redirect http://cloudflow-grafana:3000/ /proxy/grafana/;
            proxy_redirect http://$host:3000/ /proxy/grafana/;
            proxy_redirect / /proxy/grafana/;

            # HTML 内容中的绝对路径改写
            sub_filter_once off;
            sub_filter_types text/html;
            sub_filter 'href="/' 'href="/proxy/grafana/';
            sub_filter 'src="/' 'src="/proxy/grafana/';
            sub_filter 'action="/' 'action="/proxy/grafana/';
            sub_filter '"\/api\/' '"/proxy/grafana/api/';
        }

        # ============================================================
        # Prometheus 反代
        # ============================================================
        location /proxy/prometheus/ {
            proxy_pass http://prometheus:9090/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            proxy_hide_header X-Frame-Options;
            add_header X-Frame-Options SAMEORIGIN always;

            proxy_redirect / /proxy/prometheus/;
            sub_filter_once off;
            sub_filter_types text/html;
            sub_filter 'href="/' 'href="/proxy/prometheus/';
        }

        # ============================================================
        # Alertmanager 反代
        # ============================================================
        location /proxy/alertmanager/ {
            proxy_pass http://alertmanager:9093/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            proxy_hide_header X-Frame-Options;
            add_header X-Frame-Options SAMEORIGIN always;

            proxy_redirect / /proxy/alertmanager/;
        }

        # ============================================================
        # Jaeger 反代
        # ============================================================
        location /proxy/jaeger/ {
            proxy_pass http://jaeger:16686/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            proxy_hide_header X-Frame-Options;
            add_header X-Frame-Options SAMEORIGIN always;

            proxy_redirect / /proxy/jaeger/;
            sub_filter_once off;
            sub_filter_types text/html;
            sub_filter 'href="/' 'href="/proxy/jaeger/';
            sub_filter 'src="/' 'src="/proxy/jaeger/';
        }

        # AI 服务代理
        location /api/ai/ {
            rewrite ^/api/ai/(.*) /$1 break;
            proxy_pass http://cloudflow-ai-service:8082;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location /api/control/ {
            proxy_pass http://cloudflow-control-plane:8001/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /api/alert/ {
            proxy_pass http://cloudflow-alert:8009/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/ {
            proxy_pass http://cloudflow-control-plane:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /api/prometheus/ {
            proxy_pass http://prometheus:9090/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/loki/ {
            proxy_pass http://loki:3100/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/data/ {
            proxy_pass http://cloudflow-data-plane:9102/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
