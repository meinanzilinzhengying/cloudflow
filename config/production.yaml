# CloudFlow 生产环境配置示例
# 请根据实际环境修改以下配置

###########################################################################
# 关系型数据库配置（MySQL/达梦/人大金仓/高斯/OceanBase）
###########################################################################
relational_db:
  # 数据库类型: mysql / dameng / kingbase / gaussdb / oceanbase
  type: mysql
  
  # 数据库连接
  host: mysql
  port: 3306
  user: root
  password: "${MYSQL_ROOT_PASSWORD}"
  database: cloudflow
  
  # 连接池配置
  max_open_conns: 100
  max_idle_conns: 20
  conn_max_lifetime: 3600  # 秒
  
  # 双写模式（零中断迁移）
  # 0: ModeOldOnly - 仅旧库
  # 1: ModeAsyncWrite - 异步双写
  # 2: ModeSyncWrite - 同步双写
  # 3: ModeReadSplit - 读流量切分
  # 4: ModeNewOnly - 仅新库
  enable_dual_write: false
  dual_write_mode: 0
  read_split_ratio: 0.5
  
  # 从库配置（双写模式）
  secondary:
    type: dameng
    host: dameng
    port: 5236
    user: SYSDBA
    password: "${DAMENG_PASSWORD}"
    database: CLOUDFLOW

###########################################################################
# 时序数据库配置（ClickHouse/达梦时序版）
###########################################################################
timeseries_db:
  # 数据库类型: clickhouse / dameng
  type: clickhouse
  
  # 数据库连接
  host: clickhouse
  port: 9000
  user: default
  password: "${CLICKHOUSE_PASSWORD}"
  database: cloudflow
  
  # 性能调优
  batch_size: 10000
  flush_interval: 1000  # 毫秒
  max_retries: 3

###########################################################################
# KV存储配置（Redis/GaussDB(for Redis)）
###########################################################################
kv_store:
  # 存储类型: redis / gauss_redis
  type: redis
  
  # 连接配置
  host: redis
  port: 6379
  password: "${REDIS_PASSWORD}"
  db: 0
  
  # 连接池
  pool_size: 50
  min_idle_conns: 10
  
  # 过期时间
  default_ttl: 3600  # 秒

###########################################################################
# Kafka消息队列
###########################################################################
kafka:
  brokers:
    - kafka:9092
  topic: cloudflow-flows
  group_id: cloudflow-consumer
  
  # 生产者配置
  producer:
    acks: all
    retries: 3
    batch_size: 16384
    linger_ms: 5
  
  # 消费者配置
  consumer:
    auto_offset_reset: latest
    enable_auto_commit: true

###########################################################################
# etcd服务发现
###########################################################################
etcd:
  endpoints:
    - etcd:2379
  dial_timeout: 5000  # 毫秒
  auto_sync_interval: 30000
  
  # 重连配置
  max_retries: 10
  initial_backoff: 1000  # 毫秒
  max_backoff: 30000     # 毫秒

###########################################################################
# 安全配置
###########################################################################
security:
  # JWT密钥（必须≥32位，通过环境变量设置）
  jwt_secret: "${CLOUD_FLOW_JWT_SECRET}"
  
  # Token过期时间
  token_ttl: 86400  # 秒（24小时）
  
  # CORS白名单（逗号分隔）
  cors_allowed_origins: "${CORS_ALLOWED_ORIGINS}"
  
  # TLS配置
  tls:
    enabled: false
    cert_file: /etc/cloudflow/tls/server.crt
    key_file: /etc/cloudflow/tls/server.key
    ca_file: /etc/cloudflow/tls/ca.crt

###########################################################################
# eBPF采集配置
###########################################################################
ebpf:
  # 采集网卡（空表示所有网卡）
  interfaces: []
  
  # eBPF后端: libbpf / cilium / auto
  backend: auto
  
  # 采样率（1=全采样，10=1/10采样）
  sample_rate: 1
  
  # 批量上报
  batch_size: 100
  flush_interval: 1000  # 毫秒
  
  # VXLAN采集
  vxlan:
    enabled: true
    port: 8472
    tap_device: tap0

###########################################################################
# 日志配置
###########################################################################
logging:
  # 日志级别: debug / info / warn / error
  level: info
  
  # 输出格式: json / text
  format: json
  
  # 输出路径
  output:
    - stdout
    - /var/log/cloudflow/cloudflow.log
  
  # 日志轮转
  rotation:
    max_size: 100    # MB
    max_age: 30      # 天
    max_backups: 10
    compress: true

###########################################################################
# 监控配置
###########################################################################
monitoring:
  # Prometheus指标暴露
  prometheus:
    enabled: true
    port: 9090
    path: /metrics
  
  # 健康检查
  health_check:
    enabled: true
    port: 8080
    path: /health
    interval: 30  # 秒

###########################################################################
# 告警配置
###########################################################################
alerting:
  # 告警通道
  channels:
    - type: webhook
      url: "${ALERT_WEBHOOK_URL}"
      method: POST
  
  # 告警规则
  rules:
    - name: high_cpu
      expr: cpu_usage > 80
      duration: 300
      severity: warning
    
    - name: high_memory
      expr: memory_usage > 85
      duration: 300
      severity: warning
    
    - name: high_drop_rate
      expr: drop_rate > 1
      duration: 60
      severity: critical
