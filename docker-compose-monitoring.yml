# =============================================================================
# CloudFlow 监控部署配置 - 100% 纯国产化版
# =============================================================================
# 版本: v3.0 - 纯国产化
# 说明: 一体化监控平台，所有组件均为国产化
#
# 使用方式:
#   docker compose -f docker-compose-monitoring.yml up -d
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. 夜莺 Nightingale（一体化监控平台）
  # 替代: Prometheus + Grafana + Alertmanager
  # ---------------------------------------------------------------------------
  nightingale:
    image: ccr.ccs.tencentyun.com/nightingale/nightingale:v6.2.0
    container_name: cloudflow-nightingale
    restart: unless-stopped
    ports:
      - "17000:17000"
    environment:
      TZ: Asia/Shanghai
      GIN_MODE: release
    volumes:
      - nightingale-data:/app/data
      - nightingale-logs:/app/logs
      - ./monitoring/nightingale:/app/etc
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:17000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cloudflow-net

  # ---------------------------------------------------------------------------
  # 2. Categraf（指标采集器）
  # 替代: Node Exporter + Promtail + cAdvisor
  # ---------------------------------------------------------------------------
  categraf:
    image: flashcatcloud/categraf:v0.3.50
    container_name: cloudflow-categraf
    restart: unless-stopped
    privileged: true
    pid: host
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./monitoring/categraf:/etc/categraf
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
    command:
      - /usr/bin/categraf
      - --configs=/etc/categraf
    networks:
      - cloudflow-net

  # ---------------------------------------------------------------------------
  # 3. SkyWalking（分布式链路追踪）
  # 替代: Jaeger
  # ---------------------------------------------------------------------------
  skywalking-oap:
    image: apache/skywalking-oap-server:9.7.0
    container_name: cloudflow-skywalking-oap
    restart: unless-stopped
    ports:
      - "11800:11800"  # gRPC
      - "12800:12800"  # HTTP
    environment:
      TZ: Asia/Shanghai
      SW_STORAGE: h2
      SW_HEALTH_CHECKER: default
      JAVA_OPTS: "-Xms1g -Xmx1g"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:12800/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - cloudflow-net

  skywalking-ui:
    image: apache/skywalking-ui:9.7.0
    container_name: cloudflow-skywalking-ui
    restart: unless-stopped
    depends_on:
      skywalking-oap:
        condition: service_healthy
    ports:
      - "18080:8080"
    environment:
      TZ: Asia/Shanghai
      SW_OAP_ADDRESS: http://skywalking-oap:12800
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - cloudflow-net

# =============================================================================
# 网络
# =============================================================================
networks:
  cloudflow-net:
    external: true
    name: cloudflow-net

# =============================================================================
# 数据卷
# =============================================================================
volumes:
  nightingale-data:
  nightingale-logs:
