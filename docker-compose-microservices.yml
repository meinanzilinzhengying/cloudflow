# =============================================================================
# CloudFlow 微服务架构 - 100% 国产化版 v3.2
# =============================================================================
# 版本: v3.2 - 纯国产化微服务配置
# 说明: 所有微服务已适配国产数据库和中间件
#
# 适配清单:
#   ✅ TiDB → OceanBase (蚂蚁集团开源)
#   ✅ ClickHouse → openGauss (华为高斯开源)
#   ✅ etcd → Nacos (阿里巴巴开源)
#   ✅ Kafka → RocketMQ (阿里云开源)
#   ✅ Jaeger → SkyWalking (Apache 华为主导)
#
# 使用方式:
#   docker compose -f docker-compose-microservices.yml up -d
# =============================================================================

version: '3.8'

services:
  # ===========================================================================
  # 1. 认证服务 (Auth Service) - 适配 OceanBase
  # ===========================================================================
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: deployments/Dockerfile
    container_name: cloudflow-auth
    ports:
      - "127.0.0.1:8006:8006"
      - "9006:9006"
    environment:
      - SERVICE_NAME=auth-service
      - GRPC_ADDR=:9006
      - HTTP_ADDR=:8006
      - JWT_ISSUER=cloudflow
      - JWT_EXPIRE_SEC=86400
      - JWT_REFRESH_SEC=604800
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:-}
      - SUPER_ADMIN_ROLE=super_admin
      
      # OceanBase 配置（替代 TiDB，MySQL 协议兼容）
      - DB_USER=root
      - DB_PASSWORD=CloudFlow@2024
      - DB_DATABASE=cloudflow_auth
      
      # 服务发现: Nacos（替代 etcd）
      - NACOS_ADDR=nacos:8848
      - NACOS_NAMESPACE=cloudflow
      
      # OIDC 配置（可选）
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
    depends_on:
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - cloudflow-net

  # ===========================================================================
  # 2. 租户服务 (Tenant Service) - 适配 OceanBase
  # ===========================================================================
  tenant-service:
    build:
      context: ./services/tenant-service
      dockerfile: deployments/Dockerfile
    container_name: cloudflow-tenant
    ports:
      - "8010:8010"
      - "9010:9010"
    environment:
      - SERVICE_NAME=tenant-service
      - GRPC_ADDR=:9010
      - HTTP_ADDR=:8010
      
      # OceanBase 配置（替代 TiDB）
      - DB_USER=root
      - DB_PASSWORD=CloudFlow@2024
      - DB_DATABASE=cloudflow_tenant
      
      # 服务发现: Nacos
      - NACOS_ADDR=nacos:8848
      - NACOS_NAMESPACE=cloudflow
      
      # 下游服务
      - AUTH_ADDR=auth-service:9006
    depends_on:
      nacos:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - cloudflow-net

  # ===========================================================================
  # 3. 控制面服务 (Control Plane) - 适配 Nacos
  # ===========================================================================
  control-plane:
    build:
      context: ./services/control-plane
      dockerfile: deployments/Dockerfile
    container_name: cloudflow-control-plane
    ports:
      - "8001:8001"
      - "9001:9001"
    environment:
      - SERVICE_NAME=control-plane
      - GRPC_ADDR=:9001
      - HTTP_ADDR=:8001
      
      # Nacos 配置（替代 etcd）
      - NACOS_ADDR=nacos:8848
      - NACOS_NAMESPACE=cloudflow
      - NACOS_GROUP=DEFAULT_GROUP
      - SERVICE_PREFIX=/cloudflow/services/
      - AGENT_TTL=90s
      - HEARTBEAT_TIMEOUT=60s
      
      # 消息队列: RocketMQ（替代 Kafka）
      - ROCKETMQ_TOPIC=cloudflow_events
      
      # 下游服务
      - DATA_PLANE_ADDR=data-plane:9002
      - AUTH_ADDR=auth-service:9006
      - TENANT_ADDR=tenant-service:9010
    depends_on:
      nacos:
        condition: service_healthy
      data-plane:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      tenant-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    networks:
      - cloudflow-net

  # ===========================================================================
  # 4. 数据面服务 (Data Plane) - 适配 openGauss
  # ===========================================================================
  data-plane:
    image: cloudflow-data-plane:latest
    container_name: cloudflow-data-plane
    ports:
      - "9002:9002"
      - "9103:9102"
    environment:
      - SERVICE_NAME=data-plane
      - GRPC_ADDR=:9002
      - METRICS_ADDR=:9102
      - CLICKHOUSE_ADDR=clickhouse
      - CLICKHOUSE_PORT=9000
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DATABASE=cloudflow
      - CONTROL_PLANE_ADDR=control-plane:8001
      - TLS_ENABLED=false
    depends_on:
      clickhouse:
        condition: service_started
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9102/healthz]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - cloudflow-net

  # ===========================================================================
  # 5. 查询服务 (Query Service) - 适配 openGauss
  # ===========================================================================
  query-service:
    build:
      context: ./services/query-service
      dockerfile: deployments/Dockerfile
    container_name: cloudflow-query
    ports:
      - "8007:8007"
      - "9007:9007"
    environment:
      - SERVICE_NAME=query-service
      - GRPC_ADDR=:9007
      - HTTP_ADDR=:8007
      
      # openGauss 配置（替代 ClickHouse）
      - TSDB_USER=gaussdb
      - TSDB_PASSWORD=CloudFlow@2024
      - TSDB_DATABASE=cloudflow
      
      # 缓存配置
      - CACHE_ENABLED=true
      - CACHE_TTL=300s
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=CloudFlow@2024
      
      # 服务发现: Nacos
      - NACOS_ADDR=nacos:8848
      
      # 下游服务
      - AUTH_ADDR=auth-service:9006
      - TENANT_ADDR=tenant-service:9010
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      tenant-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    networks:
      - cloudflow-net

  # ===========================================================================
  # 6. 拓扑引擎 (Topology Engine) - 适配 openGauss + Redis
  # ===========================================================================
  topology-engine:
    build:
      context: ./services/topology-engine
      dockerfile: deployments/Dockerfile
    container_name: cloudflow-topology
    ports:
      - "8008:8004"
      - "9008:9008"
    environment:
      - SERVICE_NAME=topology-engine
      - GRPC_ADDR=:9008
      - HTTP_ADDR=:8008
      
      # openGauss 配置
      - TSDB_USER=gaussdb
      - TSDB_PASSWORD=CloudFlow@2024
      - TSDB_DATABASE=cloudflow
      
      # Redis 配置（拓扑缓存）
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=CloudFlow@2024
      
      # 服务发现: Nacos
      - NACOS_ADDR=nacos:8848
      
      # 下游服务
      - AUTH_ADDR=auth-service:9006
      - DATA_PLANE_ADDR=data-plane:9002
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      data-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    networks:
      - cloudflow-net

  # ===========================================================================
  # 7. 告警引擎 (Alert Engine) - 适配 OceanBase + openGauss
  # ===========================================================================
  alert-engine:
    build:
      context: ./services/alert-engine
      dockerfile: deployments/Dockerfile
    container_name: cloudflow-alert
    ports:
      - "8009:8009"
      - "9009:9009"
    environment:
      - SERVICE_NAME=alert-engine
      - GRPC_ADDR=:9009
      - HTTP_ADDR=:8009
      
      # OceanBase 配置（告警规则存储）
      - DB_USER=root
      - DB_PASSWORD=CloudFlow@2024
      - DB_DATABASE=cloudflow_alert
      
      # openGauss 配置（指标查询）
      - TSDB_USER=gaussdb
      - TSDB_PASSWORD=CloudFlow@2024
      - TSDB_DATABASE=cloudflow
      
      # Redis 配置（告警状态）
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=CloudFlow@2024
      
      # 消息队列: RocketMQ
      
      # 服务发现: Nacos
      - NACOS_ADDR=nacos:8848
      
      # 通知配置
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SLACK_WEBHOOK=${SLACK_WEBHOOK:-}
      - DINGTALK_WEBHOOK=${DINGTALK_WEBHOOK:-}
      
      # 下游服务
      - AUTH_ADDR=
      - TENANT_ADDR=tenant-service:9010
      - DATA_PLANE_ADDR=data-plane:9002
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      tenant-service:
        condition: service_healthy
      data-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - cloudflow-net

  # ===========================================================================
  # 国产化基础设施层（复用主 docker-compose.yml）
  # ===========================================================================
  
  # OceanBase - 主数据库（蚂蚁集团开源）
  redis:
    image: redis:7-alpine
    container_name: cloudflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    command: redis-server --requirepass "CloudFlow@2024"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "CloudFlow@2024", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloudflow-net

  # Nacos - 服务发现与配置中心（阿里巴巴开源，替代 etcd）
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: cloudflow-nacos
    restart: unless-stopped
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      TZ: Asia/Shanghai
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: embedded
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - cloudflow-net

  # RocketMQ - 消息队列（阿里云开源，替代 Kafka）
  cloudflow-net:
    driver: bridge
    name: cloudflow-net

# =============================================================================
# 数据卷
# =============================================================================
volumes:
  # 数据库
  redis-data:
  
  # Nacos
  nacos-data:
  nacos-logs:
  
  # RocketMQ
