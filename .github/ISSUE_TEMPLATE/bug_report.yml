name: 🐛 Bug Report
description: Create a report to help us improve
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: What happened?
    validations:
      required: true
      
  - type: textarea
    id: reproduction
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
      
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
      
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
      
  - type: input
    id: os
    attributes:
      label: OS
      description: Operating system
      placeholder: e.g., Ubuntu 22.04, CentOS 8
    validations:
      required: true
      
  - type: input
    id: go-version
    attributes:
      label: Go Version
      description: Version of Go being used
      placeholder: e.g., 1.22.0
    validations:
      required: true
      
  - type: input
    id: kernel
    attributes:
      label: Kernel Version
      description: Linux kernel version (for eBPF)
      placeholder: e.g., 5.15.0-91-generic
    validations:
      required: true
      
  - type: input
    id: cloudflow-version
    attributes:
      label: CloudFlow Version
      description: Version of CloudFlow
      placeholder: e.g., v0.1.0 or commit hash
      
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output.
      render: shell
      
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
