name: CloudFlow CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install dependencies
        run: go mod tidy

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test -v -cover ./pkg/...

      - name: Run vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.55
          args: --timeout 5m

  multi-arch-build:
    name: Multi-arch Build
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build for ${{ matrix.arch }}
        env:
          GOARCH: ${{ matrix.arch }}
          GOOS: linux
        run: |
          go build -o cloudflow-agent-${{ matrix.arch }} ./cloud-flow-agent
          go build -o cloudflow-center-${{ matrix.arch }} ./cloud-flow-center

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudflow-${{ matrix.arch }}
          path: cloudflow-*

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
