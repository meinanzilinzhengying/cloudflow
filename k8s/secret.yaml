# CloudFlow Secret
# 注意：生产环境请使用 kubectl create secret 命令创建，不要提交明文到Git
apiVersion: v1
kind: Secret
metadata:
  name: cloudflow-secrets
  namespace: cloudflow
type: Opaque
stringData:
  # JWT密钥（生产环境必须替换）
  CLOUD_FLOW_JWT_SECRET: "change-this-to-your-32-character-secret-key-in-production"
  # 数据库密码（生产环境必须替换）
  MYSQL_PASSWORD: "change-me-in-production"
  CLICKHOUSE_PASSWORD: "change-me-in-production"
  REDIS_PASSWORD: ""
