# CloudFlow Center Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-flow-center
  namespace: cloudflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloud-flow-center
  template:
    metadata:
      labels:
        app: cloud-flow-center
    spec:
      serviceAccountName: cloudflow-admin
      containers:
      - name: cloud-flow-center
        image: cloudflow/center:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: CLOUD_FLOW_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: cloudflow-secrets
              key: CLOUD_FLOW_JWT_SECRET
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cloudflow-secrets
              key: MYSQL_PASSWORD
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cloudflow-secrets
              key: CLICKHOUSE_PASSWORD
        - name: CORS_ALLOWED_ORIGINS
          value: "http://localhost:3000,http://localhost:8080"
        ports:
        - name: http
          containerPort: 8080
        - name: grpc
          containerPort: 9090
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2
            memory: 2Gi
        volumeMounts:
        - name: config
          mountPath: /etc/cloudflow
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: cloudflow-config
---
# CloudFlow Center Service
apiVersion: v1
kind: Service
metadata:
  name: cloud-flow-center
  namespace: cloudflow
spec:
  selector:
    app: cloud-flow-center
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: grpc
    port: 9090
    targetPort: 9090
  type: ClusterIP
---
