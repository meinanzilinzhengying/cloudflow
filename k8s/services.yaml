---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudflow-ingress
  namespace: cloudflow
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "100"
spec:
  ingressClassName: nginx
  rules:
  - host: cloudflow.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloud-flow-center
            port:
              number: 8080
  tls:
  - hosts:
    - cloudflow.example.com
    secretName: cloudflow-tls
