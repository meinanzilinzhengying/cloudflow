# =============================================================================
# CloudFlow 基础设施部署配置 - 100% 纯国产化版
# =============================================================================
# 版本: v3.0 - 纯国产化
# 说明: 中间件基础设施，所有组件均为国产化
#
# 使用方式:
#   docker compose -f docker-compose-infra.yml up -d
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. 达梦数据库（关系型主数据库）
  # ---------------------------------------------------------------------------
  dameng:
    image: dm8_single:v8.1.2.128_ent_x86_64
    container_name: cloudflow-dameng
    restart: unless-stopped
    ports:
      - "5236:5236"
    environment:
      TZ: Asia/Shanghai
      LD_LIBRARY_PATH: /opt/dmdbms/bin
    volumes:
      - dameng-data:/opt/dmdbms/data
    privileged: true
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1;' | /opt/dmdbms/bin/disql SYSDBA/SYSDBA@localhost:5236"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - cloudflow-net

  # ---------------------------------------------------------------------------
  # 2. 高斯Redis（缓存）
  # ---------------------------------------------------------------------------
  gauss-redis:
    image: opengauss/opengauss-redis:6.2.5
    container_name: cloudflow-gauss-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - gauss-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloudflow-net

  # ---------------------------------------------------------------------------
  # 3. Nacos（服务发现与配置中心）
  # ---------------------------------------------------------------------------
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: cloudflow-nacos
    restart: unless-stopped
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    environment:
      TZ: Asia/Shanghai
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: embedded
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - cloudflow-net

  # ---------------------------------------------------------------------------
  # 4. RocketMQ（消息队列）
  # ---------------------------------------------------------------------------
  rocketmq-namesrv:
    image: apache/rocketmq:5.2.0
    container_name: cloudflow-rocketmq-namesrv
    restart: unless-stopped
    ports:
      - "9876:9876"
    environment:
      TZ: Asia/Shanghai
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"
    command: sh mqnamesrv
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9876/rocketmq/NamesrvConfig/getConfig | grep -q serverName"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cloudflow-net

  rocketmq-broker:
    image: apache/rocketmq:5.2.0
    container_name: cloudflow-rocketmq-broker
    restart: unless-stopped
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    ports:
      - "10909:10909"
      - "10911:10911"
    environment:
      TZ: Asia/Shanghai
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
    command: sh mqbroker -c /home/rocketmq/conf/broker.conf
    volumes:
      - rocketmq-broker-data:/home/rocketmq/store
      - rocketmq-broker-logs:/home/rocketmq/logs
    healthcheck:
      test: ["CMD-SHELL", "mqadmin clusterList -n localhost:9876 2>/dev/null | grep -q brokerName"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - cloudflow-net

# =============================================================================
# 网络
# =============================================================================
networks:
  cloudflow-net:
    driver: bridge
    name: cloudflow-net

# =============================================================================
# 数据卷
# =============================================================================
volumes:
  dameng-data:
  gauss-redis-data:
  nacos-data:
  nacos-logs:
  rocketmq-namesrv-logs:
  rocketmq-broker-data:
  rocketmq-broker-logs:
