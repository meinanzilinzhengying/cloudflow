worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        root /usr/share/nginx/html;
        index index.html;

        # HTML文件禁用缓存，确保用户总是拿到最新版本
        location ~* \.html$ {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires 0;
        }

        # 静态资源：js/css/图片等，带长期缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires 7d;
        }

        # API代理规则（优先级高于SPA兜底）
        location /api/auth/ {
            proxy_pass http://192.168.58.130:8006/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/control/ {
            proxy_pass http://192.168.58.130:8001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 项目标准查询入口，对接 cloudflow-query 服务(:8007)
        location /api/query/ {
            proxy_pass http://192.168.58.130:8007/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/alert/ {
            proxy_pass http://192.168.58.130:8009/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/tenant/ {
            proxy_pass http://192.168.58.130:8010/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 拓扑服务 (:8004)
        location /api/topology/ {
            proxy_pass http://192.168.58.130:8004/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # VM2 探针API
        location /api/v1/ {
            proxy_pass http://192.168.58.130:9090/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 兼容路径：STB自定义页面直查ClickHouse，后续合入原生体系后统一迁移至 /api/query
        location /api/clickhouse/ {
            proxy_pass http://127.0.0.1:8123/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # SPA路由兜底：非静态、非API、非HTML的路径
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
