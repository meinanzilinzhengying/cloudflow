{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cloudflow.fullname" . }}
  labels:
    {{- include "cloudflow.labels" . | nindent 4 }}
rules:
{{- toYaml .Values.rbac.clusterRole.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cloudflow.fullname" . }}
  labels:
    {{- include "cloudflow.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cloudflow.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cloudflow.serviceAccountName" . }}
    namespace: {{ include "cloudflow.namespace" . }}
{{- end }}
