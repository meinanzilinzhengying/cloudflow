{{- if and .Values.edge.enabled .Values.edge.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "cloudflow.edge.name" . }}
  namespace: {{ include "cloudflow.namespace" . }}
  labels:
    {{- include "cloudflow.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "cloudflow.edge.name" . }}
  minReplicas: {{ .Values.edge.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.edge.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.edge.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.edge.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.edge.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.edge.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
