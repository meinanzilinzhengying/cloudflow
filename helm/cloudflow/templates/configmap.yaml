---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloudflow.config.name" . }}
  namespace: {{ include "cloudflow.namespace" . }}
  labels:
    {{- include "cloudflow.labels" . | nindent 4 }}
data:
  config.yaml: |
    log_level: {{ .Values.config.logLevel }}
    environment: {{ .Values.config.environment | default "production" }}
    relational_db:
      type: {{ .Values.config.database.type }}
      host: {{ .Values.config.database.host }}
      port: {{ .Values.config.database.port }}
      user: {{ .Values.config.database.user }}
      database: {{ .Values.config.database.database }}
      max_open_conns: {{ .Values.config.database.maxOpenConns | default 100 }}
      max_idle_conns: {{ .Values.config.database.maxIdleConns | default 20 }}
    timeseries_db:
      type: {{ .Values.config.timeseries.type }}
      host: {{ .Values.config.timeseries.host }}
      port: {{ .Values.config.timeseries.port }}
      user: {{ .Values.config.timeseries.user | default "default" }}
      database: {{ .Values.config.timeseries.database | default "cloudflow" }}
    kv_store:
      type: redis
      host: {{ .Values.config.redis.host }}
      port: {{ .Values.config.redis.port }}
      db: {{ .Values.config.redis.db | default 0 }}
    etcd:
      endpoints:
{{- range .Values.config.etcd.endpoints }}
        - {{ . }}
{{- end }}
      dial_timeout: {{ .Values.config.etcd.dialTimeout | default "5s" }}
    cors:
      allowed_origins:
{{- range .Values.config.cors.allowedOrigins }}
        - {{ . }}
{{- end }}
