version: "3.9"

services:
  # Zookeeper for Kafka coordination
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.1
    container_name: cf-zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - cloudflow-staging
    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'ruok' | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka for data ingestion
  kafka:
    image: confluentinc/cp-kafka:7.4.1
    container_name: cf-kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_BYTES: 10737418240
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - cloudflow-staging
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  # MySQL 8.0 for relational data
  mysql:
    image: mysql:8.0.34
    container_name: cf-mysql
    hostname: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: cloudflow_root_staging
      MYSQL_DATABASE: cloudflow
      MYSQL_USER: cloudflow
      MYSQL_PASSWORD: cloudflow_staging_2024
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/mysql-init:/docker-entrypoint-initdb.d:ro
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=512M
      --max-connections=200
    networks:
      - cloudflow-staging
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pcloudflow_root_staging"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ClickHouse for analytics and time-series data
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: cf-clickhouse
    hostname: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./config/clickhouse:/etc/clickhouse-server/config.d:ro
    environment:
      CLICKHOUSE_DB: cloudflow
      CLICKHOUSE_USER: cloudflow
      CLICKHOUSE_PASSWORD: cloudflow_click_staging_2024
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    networks:
      - cloudflow-staging
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping", "||", "exit", "1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Redis for caching and leader election
  redis:
    image: redis:7.2-alpine
    container_name: cf-redis
    hostname: redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 100
    volumes:
      - redis-data:/data
    networks:
      - cloudflow-staging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # etcd for service discovery and distributed locks
  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: cf-etcd
    hostname: etcd
    ports:
      - "2379:2379"
      - "2380:2380"
    environment:
      ETCD_NAME: etcd-1
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: etcd-1=http://etcd:2380
      ETCD_INITIAL_CLUSTER_TOKEN: cloudflow-etcd-cluster
      ETCD_INITIAL_CLUSTER_STATE: new
    volumes:
      - etcd-data:/etcd-data
    networks:
      - cloudflow-staging
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: cf-prometheus
    hostname: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - cloudflow-staging
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Grafana for dashboards and visualization
  grafana:
    image: grafana/grafana:10.1.2
    container_name: cf-grafana
    hostname: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: cloudflow_grafana_staging
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - cloudflow-staging
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # CloudFlow Auth Service
  auth-service:
    image: cloudflow/auth-service:latest
    container_name: cf-auth-service
    hostname: auth-service
    ports:
      - "8001:8001"
    environment:
      CF_ENV: staging
      CF_HTTP_PORT: 8001
      CF_GRPC_PORT: 9001
      CF_DB_HOST: mysql
      CF_DB_PORT: 3306
      CF_DB_USER: cloudflow
      CF_DB_PASSWORD: cloudflow_staging_2024
      CF_DB_NAME: cloudflow_auth
      CF_REDIS_HOST: redis
      CF_REDIS_PORT: 6379
      CF_REDIS_PASSWORD: ""
      CF_ETCD_ENDPOINTS: etcd:2379
      CF_JWT_SECRET: cloudflow-staging-jwt-secret-change-in-production
      CF_LOG_LEVEL: info
      CF_METRICS_PORT: 9101
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_healthy
    networks:
      - cloudflow-staging
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # CloudFlow Tenant Service
  tenant-service:
    image: cloudflow/tenant-service:latest
    container_name: cf-tenant-service
    hostname: tenant-service
    ports:
      - "8002:8002"
    environment:
      CF_ENV: staging
      CF_HTTP_PORT: 8002
      CF_GRPC_PORT: 9002
      CF_DB_HOST: mysql
      CF_DB_PORT: 3306
      CF_DB_USER: cloudflow
      CF_DB_PASSWORD: cloudflow_staging_2024
      CF_DB_NAME: cloudflow_tenant
      CF_REDIS_HOST: redis
      CF_REDIS_PORT: 6379
      CF_REDIS_PASSWORD: ""
      CF_ETCD_ENDPOINTS: etcd:2379
      CF_LOG_LEVEL: info
      CF_METRICS_PORT: 9102
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_healthy
    networks:
      - cloudflow-staging
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # CloudFlow Control Plane
  control-plane:
    image: cloudflow/control-plane:latest
    container_name: cf-control-plane
    hostname: control-plane
    ports:
      - "8003:8003"
    environment:
      CF_ENV: staging
      CF_HTTP_PORT: 8003
      CF_GRPC_PORT: 9003
      CF_DB_HOST: mysql
      CF_DB_PORT: 3306
      CF_DB_USER: cloudflow
      CF_DB_PASSWORD: cloudflow_staging_2024
      CF_DB_NAME: cloudflow_control
      CF_REDIS_HOST: redis
      CF_REDIS_PORT: 6379
      CF_REDIS_PASSWORD: ""
      CF_ETCD_ENDPOINTS: etcd:2379
      CF_KAFKA_BROKERS: kafka:9092
      CF_LOG_LEVEL: info
      CF_METRICS_PORT: 9103
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - cloudflow-staging
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8003/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # CloudFlow Data Plane
  data-plane:
    image: cloudflow/data-plane:latest
    container_name: cf-data-plane
    hostname: data-plane
    ports:
      - "8004:8004"
      - "9004:9004"
    environment:
      CF_ENV: staging
      CF_HTTP_PORT: 8004
      CF_GRPC_PORT: 9004
      CF_KAFKA_BROKERS: kafka:9092
      CF_KAFKA_TOPIC: metrics.ingestion
      CF_CLICKHOUSE_HOST: clickhouse
      CF_CLICKHOUSE_PORT: 9000
      CF_CLICKHOUSE_DB: cloudflow
      CF_CLICKHOUSE_USER: cloudflow
      CF_CLICKHOUSE_PASSWORD: cloudflow_click_staging_2024
      CF_REDIS_HOST: redis
      CF_REDIS_PORT: 6379
      CF_REDIS_PASSWORD: ""
      CF_ETCD_ENDPOINTS: etcd:2379
      CF_LOG_LEVEL: info
      CF_METRICS_PORT: 9104
      CF_INGESTION_BATCH_SIZE: 1000
      CF_INGESTION_FLUSH_INTERVAL: 5s
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_healthy
    networks:
      - cloudflow-staging
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8004/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # CloudFlow Query Service
  query-service:
    image: cloudflow/query-service:latest
    container_name: cf-query-service
    hostname: query-service
    ports:
      - "8005:8005"
      - "9005:9005"
    environment:
      CF_ENV: staging
      CF_HTTP_PORT: 8005
      CF_GRPC_PORT: 9005
      CF_CLICKHOUSE_HOST: clickhouse
      CF_CLICKHOUSE_PORT: 9000
      CF_CLICKHOUSE_DB: cloudflow
      CF_CLICKHOUSE_USER: cloudflow
      CF_CLICKHOUSE_PASSWORD: cloudflow_click_staging_2024
      CF_REDIS_HOST: redis
      CF_REDIS_PORT: 6379
      CF_REDIS_PASSWORD: ""
      CF_ETCD_ENDPOINTS: etcd:2379
      CF_LOG_LEVEL: info
      CF_METRICS_PORT: 9105
      CF_QUERY_TIMEOUT: 30s
      CF_MAX_CONCURRENT_QUERIES: 100
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_healthy
    networks:
      - cloudflow-staging
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8005/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # CloudFlow Alert Engine
  alert-engine:
    image: cloudflow/alert-engine:latest
    container_name: cf-alert-engine
    hostname: alert-engine
    ports:
      - "8006:8006"
    environment:
      CF_ENV: staging
      CF_HTTP_PORT: 8006
      CF_GRPC_PORT: 9006
      CF_DB_HOST: mysql
      CF_DB_PORT: 3306
      CF_DB_USER: cloudflow
      CF_DB_PASSWORD: cloudflow_staging_2024
      CF_DB_NAME: cloudflow_alerts
      CF_CLICKHOUSE_HOST: clickhouse
      CF_CLICKHOUSE_PORT: 9000
      CF_CLICKHOUSE_DB: cloudflow
      CF_CLICKHOUSE_USER: cloudflow
      CF_CLICKHOUSE_PASSWORD: cloudflow_click_staging_2024
      CF_REDIS_HOST: redis
      CF_REDIS_PORT: 6379
      CF_REDIS_PASSWORD: ""
      CF_ETCD_ENDPOINTS: etcd:2379
      CF_KAFKA_BROKERS: kafka:9092
      CF_LOG_LEVEL: info
      CF_METRICS_PORT: 9106
      CF_EVALUATION_INTERVAL: 30s
      CF_NOTIFICATION_TIMEOUT: 10s
    depends_on:
      mysql:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - cloudflow-staging
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8006/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Nginx reverse proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: cf-nginx
    hostname: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      auth-service:
        condition: service_healthy
      tenant-service:
        condition: service_healthy
      control-plane:
        condition: service_healthy
      data-plane:
        condition: service_healthy
      query-service:
        condition: service_healthy
      alert-engine:
        condition: service_healthy
    networks:
      - cloudflow-staging
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
    driver: local
  clickhouse-data:
    driver: local
  redis-data:
    driver: local
  etcd-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  cloudflow-staging:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
