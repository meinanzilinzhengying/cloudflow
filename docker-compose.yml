# =============================================================================
# CloudFlow 开发环境部署 - 100% 可部署版
# =============================================================================
# 版本: v3.2 - 最终可部署版
# 说明: 所有镜像均为Docker Hub公开镜像，无需认证即可拉取
#
# 组件清单（全部公开可拉取）:
#   - OceanBase 4.2.2 (主数据库, 蚂蚁集团开源)
#   - openGauss 5.0.0 (时序数据库, 华为开源)
#   - Redis 7 (缓存, 兼容高斯Redis)
#   - Nacos 2.3.2 (服务发现, 阿里巴巴开源)
#   - RocketMQ 5.2.0 (消息队列, 阿里云开源)
#   - Prometheus + Grafana (监控, CNCF标准)
#   - SkyWalking 9.7.0 (链路追踪, Apache)
#   - Nginx (Web网关)
#
# 使用方式:
#   docker compose up -d
#
# 面板访问:
#   Nacos:        http://localhost:8848  (nacos/nacos)
#   Grafana:      http://localhost:3000  (admin/admin)
#   Prometheus:   http://localhost:9090
#   SkyWalking:   http://localhost:18080 (admin/admin)
#   RocketMQ:     http://localhost:8080
# =============================================================================

version: '3.8'

services:
  # ===========================================================================
  # 1. 数据库层（100%国产 + 公开镜像）
  # ===========================================================================
  
  # OceanBase - 主数据库（蚂蚁集团开源）
  oceanbase:
    image: oceanbase/oceanbase-ce:4.2.2
    container_name: cloudflow-oceanbase
    restart: unless-stopped
    ports:
      - "2881:2881"
    environment:
      TZ: Asia/Shanghai
      OB_ROOT_PASSWORD: "CloudFlow@2024"
      OB_CLUSTER_NAME: cloudflow
      OB_TENANT_NAME: sys
    volumes:
      - oceanbase-data:/root/ob
      - oceanbase-logs:/root/log
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P2881 -uroot -pCloudFlow@2024 -e 'SELECT 1;' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - cloudflow-net

  # openGauss - 时序数据库（华为高斯开源版）
  opengauss:
    image: opengauss/opengauss:5.0.0
    container_name: cloudflow-opengauss
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      TZ: Asia/Shanghai
      GS_PASSWORD: "CloudFlow@2024"
      GS_USERNAME: gaussdb
      GS_DB: cloudflow
    volumes:
      - opengauss-data:/var/lib/opengauss
    privileged: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U gaussdb"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - cloudflow-net

  # Redis - 缓存（兼容高斯Redis协议）
  redis:
    image: redis:7-alpine
    container_name: cloudflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    command: redis-server --requirepass "CloudFlow@2024"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "CloudFlow@2024", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloudflow-net

  # ===========================================================================
  # 2. 中间件层（100%国产 + 公开镜像）
  # ===========================================================================
  
  # Nacos - 服务发现与配置中心（阿里巴巴开源）
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: cloudflow-nacos
    restart: unless-stopped
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      TZ: Asia/Shanghai
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: embedded
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - cloudflow-net

  # RocketMQ - 消息队列（阿里云开源）
  rocketmq-namesrv:
    image: apache/rocketmq:5.2.0
    container_name: cloudflow-rocketmq-namesrv
    restart: unless-stopped
    ports:
      - "9876:9876"
    environment:
      TZ: Asia/Shanghai
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"
    command: sh mqnamesrv
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9876 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cloudflow-net

  rocketmq-broker:
    image: apache/rocketmq:5.2.0
    container_name: cloudflow-rocketmq-broker
    restart: unless-stopped
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    ports:
      - "10909:10909"
      - "10911:10911"
    environment:
      TZ: Asia/Shanghai
      NAMESRV_ADDR: "rocketmq-namesrv:9876"
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf
    volumes:
      - rocketmq-broker-data:/home/rocketmq/store
      - rocketmq-broker-logs:/home/rocketmq/logs
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 10911 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - cloudflow-net

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:1.0.0
    container_name: cloudflow-rocketmq-dashboard
    restart: unless-stopped
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876 -Xms256m -Xmx256m"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cloudflow-net

  # ===========================================================================
  # 3. 监控层（标准开源方案，100%公开镜像）
  # ===========================================================================
  
  # Prometheus - 指标存储
  prometheus:
    image: prom/prometheus:latest
    container_name: cloudflow-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - cloudflow-net

  # Grafana - 监控面板
  grafana:
    image: grafana/grafana:latest
    container_name: cloudflow-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TZ: Asia/Shanghai
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cloudflow-net

  # ===========================================================================
  # 4. 链路追踪（Apache 华为主导）
  # ===========================================================================
  
  # SkyWalking OAP
  skywalking-oap:
    image: apache/skywalking-oap-server:9.7.0
    container_name: cloudflow-skywalking-oap
    restart: unless-stopped
    ports:
      - "11800:11800"
      - "12800:12800"
    environment:
      TZ: Asia/Shanghai
      SW_STORAGE: h2
      SW_HEALTH_CHECKER: default
      JAVA_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:12800/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - cloudflow-net

  # SkyWalking UI
  skywalking-ui:
    image: apache/skywalking-ui:9.7.0
    container_name: cloudflow-skywalking-ui
    restart: unless-stopped
    depends_on:
      skywalking-oap:
        condition: service_healthy
    ports:
      - "18080:8080"
    environment:
      TZ: Asia/Shanghai
      SW_OAP_ADDRESS: http://skywalking-oap:12800
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cloudflow-net

  # ===========================================================================
  # 5. Web 网关
  # ===========================================================================
  
  nginx:
    image: nginx:alpine
    container_name: cloudflow-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - nginx-logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cloudflow-net

# =============================================================================
# 网络
# =============================================================================
networks:
  cloudflow-net:
    driver: bridge
    name: cloudflow-net

# =============================================================================
# 数据卷
# =============================================================================
volumes:
  # 数据库
  oceanbase-data:
  oceanbase-logs:
  opengauss-data:
  redis-data:
  
  # Nacos
  nacos-data:
  nacos-logs:
  
  # RocketMQ
  rocketmq-namesrv-logs:
  rocketmq-broker-data:
  rocketmq-broker-logs:
  
  # 监控
  prometheus-data:
  grafana-data:
  
  # Nginx
  nginx-logs:
