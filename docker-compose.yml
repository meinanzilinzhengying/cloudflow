# =============================================================================
# CloudFlow 开发环境部署 - 低资源版 v3.2.1
# =============================================================================
# 版本: v3.2.1 - 适配低资源VM
# 说明: 针对资源受限环境优化，所有组件均可在2核4GB VM上运行
#
# 资源优化策略:
#   ✅ 主数据库: PostgreSQL (256MB内存) → 协议兼容所有国产数据库
#   ✅ 时序数据库: TimescaleDB (基于PostgreSQL) → 兼容openGauss
#   ✅ 缓存: Redis 7-alpine (100MB)
#   ✅ 服务发现: Nacos 精简模式 (512MB)
#   ✅ 消息队列: RocketMQ 精简配置 (512MB)
#   ✅ 监控: Prometheus + Grafana (精简)
#
# 生产环境切换说明:
#   代码层已支持6个国产数据库驱动，生产环境只需修改DB_TYPE即可:
#   - DB_TYPE=dameng     (达梦)
#   - DB_TYPE=kingbase   (人大金仓)
#   - DB_TYPE=gaussdb    (高斯)
#   - DB_TYPE=oceanbase  (OceanBase)
#
# 使用方式:
#   docker compose up -d
#
# 面板访问:
#   Nacos:        http://localhost:8848  (nacos/nacos)
#   Grafana:      http://localhost:3000  (admin/admin)
#   Prometheus:   http://localhost:9090
#   SkyWalking:   http://localhost:18080 (admin/admin)
#   RocketMQ:     http://localhost:8080
# =============================================================================

version: '3.8'

services:
  # ===========================================================================
  # PostgreSQL - 主数据库（开发环境，协议兼容所有国产数据库）
  # 生产环境可无缝切换为: 达梦/人大金仓/高斯/OceanBase
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: cloudflow-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: cloudflow
      POSTGRES_PASSWORD: CloudFlow@2024
      POSTGRES_DB: cloudflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cloudflow-net

  # ===========================================================================
  # TimescaleDB - 时序数据库（开发环境，基于PostgreSQL）
  # 生产环境可无缝切换为: openGauss/达梦时序
  # ===========================================================================
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: cloudflow-timescaledb
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: cloudflow
      POSTGRES_PASSWORD: CloudFlow@2024
      POSTGRES_DB: cloudflow_ts
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cloudflow-net

  # ===========================================================================
  # Redis - 缓存（兼容高斯Redis协议）
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: cloudflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    command: redis-server --requirepass "CloudFlow@2024" --maxmemory 256mb
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "CloudFlow@2024", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloudflow-net

  # ===========================================================================
  # Nacos - 服务发现与配置中心（阿里巴巴开源，替代 etcd）
  # ===========================================================================
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: cloudflow-nacos
    restart: unless-stopped
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      TZ: Asia/Shanghai
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: embedded
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - cloudflow-net

  # ===========================================================================
  # RocketMQ - 消息队列（阿里云开源，替代 Kafka）
  # ===========================================================================
  rocketmq-namesrv:
    image: apache/rocketmq:5.2.0
    container_name: cloudflow-rocketmq-namesrv
    restart: unless-stopped
    ports:
      - "9876:9876"
    environment:
      TZ: Asia/Shanghai
      JAVA_OPT_EXT: "-Xms128m -Xmx256m -Xmn128m"
    command: sh mqnamesrv
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9876 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cloudflow-net

  rocketmq-broker:
    image: apache/rocketmq:5.2.0
    container_name: cloudflow-rocketmq-broker
    restart: unless-stopped
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    ports:
      - "10909:10909"
      - "10911:10911"
    environment:
      TZ: Asia/Shanghai
      NAMESRV_ADDR: "rocketmq-namesrv:9876"
      JAVA_OPT_EXT: "-Xms256m -Xmx512m -Xmn128m"
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf
    volumes:
      - rocketmq-broker-data:/home/rocketmq/store
      - rocketmq-broker-logs:/home/rocketmq/logs
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 10911 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - cloudflow-net

  # ===========================================================================
  # Prometheus - 指标存储
  # ===========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: cloudflow-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=7d'
    volumes:
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cloudflow-net

  # ===========================================================================
  # Grafana - 监控面板
  # ===========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: cloudflow-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TZ: Asia/Shanghai
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cloudflow-net

  # ===========================================================================
  # SkyWalking - 链路追踪（Apache 华为主导）
  # ===========================================================================
  skywalking-oap:
    image: apache/skywalking-oap-server:9.7.0
    container_name: cloudflow-skywalking-oap
    restart: unless-stopped
    ports:
      - "11800:11800"
      - "12800:12800"
    environment:
      TZ: Asia/Shanghai
      SW_STORAGE: h2
      JAVA_OPTS: "-Xms256m -Xmx512m"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:12800/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - cloudflow-net

  skywalking-ui:
    image: apache/skywalking-ui:9.7.0
    container_name: cloudflow-skywalking-ui
    restart: unless-stopped
    ports:
      - "18080:8080"
    environment:
      TZ: Asia/Shanghai
      SW_OAP_ADDRESS: http://skywalking-oap:12800
    depends_on:
      skywalking-oap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8080"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cloudflow-net

  # ===========================================================================
  # Nginx - Web网关
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: cloudflow-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - nginx-logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloudflow-net

# =============================================================================
# 网络
# =============================================================================
networks:
  cloudflow-net:
    driver: bridge
    name: cloudflow-net

# =============================================================================
# 数据卷
# =============================================================================
volumes:
  # 数据库
  postgres-data:
  timescaledb-data:
  redis-data:
  
  # Nacos
  nacos-data:
  nacos-logs:
  
  # RocketMQ
  rocketmq-namesrv-logs:
  rocketmq-broker-data:
  rocketmq-broker-logs:
  
  # 监控
  prometheus-data:
  grafana-data:
  
  # Nginx
  nginx-logs:
