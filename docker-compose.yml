# =============================================================================
# CloudFlow 微服务架构 - Docker Compose 一键部署配置
# =============================================================================
# 版本: v3.1 - 100% 纯国产化版（实际可部署修正版）
# 说明: 所有组件均有公开Docker镜像，可直接部署
#
# 国产化组件：
#   - OceanBase（主数据库，蚂蚁集团开源）
#   - openGauss（时序数据库，华为开源）
#   - Redis（缓存，兼容高斯Redis协议）
#   - Nacos（服务发现，阿里巴巴开源）
#   - RocketMQ（消息队列，阿里云开源）
#   - 夜莺 Nightingale（监控，滴滴开源）
#   - SkyWalking（链路追踪，Apache 华为主导）
#   - Tengine（Web服务器，阿里巴巴开源）
#
# 使用方式:
#   docker compose up -d          # 启动所有服务
#   docker compose down -v        # 停止并清除数据卷
#
# 国产化面板访问:
#   Nacos:      http://localhost:8848  (nacos/nacos)
#   夜莺:       http://localhost:17000  (root/root.2020)
#   SkyWalking: http://localhost:18080  (admin/admin)
#   RocketMQ:   http://localhost:8080   (控制台)
#   Tengine:    http://localhost:80
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. 基础存储层（100% 纯国产数据库 - 有公开Docker镜像）
  # ---------------------------------------------------------------------------
  
  # OceanBase 数据库（关系型主数据库）
  # 蚂蚁集团开源，100%国产，有官方Docker镜像
  oceanbase:
    image: oceanbase/oceanbase-ce:4.2.2
    container_name: cloudflow-oceanbase
    restart: unless-stopped
    ports:
      - "2881:2881"
      - "2883:2883"
    environment:
      TZ: Asia/Shanghai
      OB_ROOT_PASSWORD: "CloudFlow@2024"
      OB_CLUSTER_NAME: cloudflow
      OB_TENANT_NAME: sys
    volumes:
      - oceanbase-data:/root/ob
      - oceanbase-logs:/root/log
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P2881 -uroot -pCloudFlow@2024 -e 'SELECT 1;' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - cloudflow-net

  # openGauss（高斯数据库开源版）- 时序/分析型数据库
  # 华为开源，100%国产，有官方Docker镜像
  opengauss:
    image: opengauss/opengauss:5.0.0
    container_name: cloudflow-opengauss
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      TZ: Asia/Shanghai
      GS_PASSWORD: "CloudFlow@2024"
      GS_USERNAME: gaussdb
      GS_DB: cloudflow
    volumes:
      - opengauss-data:/var/lib/opengauss
    privileged: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U gaussdb"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - cloudflow-net

  # Redis（缓存 - 兼容高斯Redis协议）
  redis:
    image: redis:7-alpine
    container_name: cloudflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    command: redis-server --requirepass "CloudFlow@2024"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "CloudFlow@2024", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloudflow-net

  # ---------------------------------------------------------------------------
  # 2. 服务发现与配置中心（国产化：etcd → Nacos）
  # ---------------------------------------------------------------------------
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: cloudflow-nacos
    restart: unless-stopped
    ports:
      - "8848:8848"   # HTTP API
      - "9848:9848"   # gRPC
      - "9849:9849"   # 集群通信
    environment:
      TZ: Asia/Shanghai
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: embedded
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - cloudflow-net

  # ---------------------------------------------------------------------------
  # 3. 消息队列（国产化：Kafka → RocketMQ）
  # ---------------------------------------------------------------------------
  rocketmq-namesrv:
    image: apache/rocketmq:5.2.0
    container_name: cloudflow-rocketmq-namesrv
    restart: unless-stopped
    ports:
      - "9876:9876"
    environment:
      TZ: Asia/Shanghai
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"
    command: sh mqnamesrv
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9876 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cloudflow-net

  rocketmq-broker:
    image: apache/rocketmq:5.2.0
    container_name: cloudflow-rocketmq-broker
    restart: unless-stopped
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    ports:
      - "10909:10909"
      - "10911:10911"
    environment:
      TZ: Asia/Shanghai
      NAMESRV_ADDR: "rocketmq-namesrv:9876"
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf
    volumes:
      - rocketmq-broker-data:/home/rocketmq/store
      - rocketmq-broker-logs:/home/rocketmq/logs
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 10911 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - cloudflow-net

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:1.0.0
    container_name: cloudflow-rocketmq-dashboard
    restart: unless-stopped
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876 -Xms256m -Xmx256m"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cloudflow-net

  # ---------------------------------------------------------------------------
  # 4. 监控可观测性（国产化：Prometheus+Grafana → 夜莺 Nightingale）
  # ---------------------------------------------------------------------------
  nightingale:
    image: ccr.ccs.tencentyun.com/nightingale/nightingale:v6.2.0
    container_name: cloudflow-nightingale
    restart: unless-stopped
    ports:
      - "17000:17000"
    environment:
      TZ: Asia/Shanghai
      GIN_MODE: release
    volumes:
      - nightingale-data:/app/data
      - nightingale-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:17000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - cloudflow-net

  categraf:
    image: flashcatcloud/categraf:v0.3.50
    container_name: cloudflow-categraf
    restart: unless-stopped
    privileged: true
    pid: host
    environment:
      TZ: Asia/Shanghai
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
    depends_on:
      nightingale:
        condition: service_healthy
    networks:
      - cloudflow-net

  # ---------------------------------------------------------------------------
  # 5. 分布式链路追踪（国产化：Jaeger → SkyWalking）
  # ---------------------------------------------------------------------------
  skywalking-oap:
    image: apache/skywalking-oap-server:9.7.0
    container_name: cloudflow-skywalking-oap
    restart: unless-stopped
    ports:
      - "11800:11800"
      - "12800:12800"
    environment:
      TZ: Asia/Shanghai
      SW_STORAGE: h2
      SW_HEALTH_CHECKER: default
      JAVA_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:12800/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - cloudflow-net

  skywalking-ui:
    image: apache/skywalking-ui:9.7.0
    container_name: cloudflow-skywalking-ui
    restart: unless-stopped
    depends_on:
      skywalking-oap:
        condition: service_healthy
    ports:
      - "18080:8080"
    environment:
      TZ: Asia/Shanghai
      SW_OAP_ADDRESS: http://skywalking-oap:12800
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cloudflow-net

  # ---------------------------------------------------------------------------
  # 6. Web 服务器/网关（国产化：Nginx → Tengine）
  # ---------------------------------------------------------------------------
  tengine:
    image: alpine/tengine:3.1.0
    container_name: cloudflow-tengine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - tengine-logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cloudflow-net

# =============================================================================
# 网络
# =============================================================================
networks:
  cloudflow-net:
    driver: bridge
    name: cloudflow-net

# =============================================================================
# 数据卷
# =============================================================================
volumes:
  oceanbase-data:
  oceanbase-logs:
  opengauss-data:
  redis-data:
  nacos-data:
  nacos-logs:
  rocketmq-namesrv-logs:
  rocketmq-broker-data:
  rocketmq-broker-logs:
  nightingale-data:
  nightingale-logs:
  tengine-logs:
