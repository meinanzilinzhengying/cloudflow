# =============================================================================
# CloudFlow 生产环境部署配置 - 100% 纯国产化版
# =============================================================================
# 版本: v3.0 - 纯国产化
# 说明: 生产环境高可用部署，所有组件均为国产化
#
# 使用方式:
#   docker compose -f docker-compose.prod.yml up -d
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. 国产数据库集群
  # ---------------------------------------------------------------------------
  # 达梦数据库（主节点）
  dameng-master:
    image: dm8_single:v8.1.2.128_ent_x86_64
    container_name: cloudflow-dameng-master
    restart: always
    ports:
      - "5236:5236"
    environment:
      TZ: Asia/Shanghai
      LD_LIBRARY_PATH: /opt/dmdbms/bin
    volumes:
      - dameng-master-data:/opt/dmdbms/data
    privileged: true
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    networks:
      - cloudflow-prod-net

  # 高斯Redis
  gauss-redis:
    image: opengauss/opengauss-redis:6.2.5
    container_name: cloudflow-gauss-redis
    restart: always
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - gauss-redis-data:/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    networks:
      - cloudflow-prod-net

  # ---------------------------------------------------------------------------
  # 2. Nacos 服务发现集群（3节点高可用）
  # ---------------------------------------------------------------------------
  nacos-1:
    image: nacos/nacos-server:v2.3.2
    container_name: cloudflow-nacos-1
    restart: always
    ports:
      - "8848:8848"
    environment:
      TZ: Asia/Shanghai
      MODE: cluster
      NACOS_SERVERS: nacos-1:8848,nacos-2:8848,nacos-3:8848
      SPRING_DATASOURCE_PLATFORM: mysql
      JVM_XMS: 1g
      JVM_XMX: 1g
      JVM_XMN: 512m
    volumes:
      - nacos-1-data:/home/nacos/data
      - nacos-1-logs:/home/nacos/logs
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    networks:
      - cloudflow-prod-net

  nacos-2:
    image: nacos/nacos-server:v2.3.2
    container_name: cloudflow-nacos-2
    restart: always
    environment:
      TZ: Asia/Shanghai
      MODE: cluster
      NACOS_SERVERS: nacos-1:8848,nacos-2:8848,nacos-3:8848
      SPRING_DATASOURCE_PLATFORM: mysql
      JVM_XMS: 1g
      JVM_XMX: 1g
      JVM_XMN: 512m
    volumes:
      - nacos-2-data:/home/nacos/data
      - nacos-2-logs:/home/nacos/logs
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    networks:
      - cloudflow-prod-net

  nacos-3:
    image: nacos/nacos-server:v2.3.2
    container_name: cloudflow-nacos-3
    restart: always
    environment:
      TZ: Asia/Shanghai
      MODE: cluster
      NACOS_SERVERS: nacos-1:8848,nacos-2:8848,nacos-3:8848
      SPRING_DATASOURCE_PLATFORM: mysql
      JVM_XMS: 1g
      JVM_XMX: 1g
      JVM_XMN: 512m
    volumes:
      - nacos-3-data:/home/nacos/data
      - nacos-3-logs:/home/nacos/logs
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    networks:
      - cloudflow-prod-net

  # ---------------------------------------------------------------------------
  # 3. RocketMQ 消息队列集群（高可用）
  # ---------------------------------------------------------------------------
  rocketmq-namesrv-1:
    image: apache/rocketmq:5.2.0
    container_name: cloudflow-rocketmq-namesrv-1
    restart: always
    ports:
      - "9876:9876"
    environment:
      TZ: Asia/Shanghai
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
    command: sh mqnamesrv
    volumes:
      - rocketmq-namesrv-1-logs:/home/rocketmq/logs
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - cloudflow-prod-net

  rocketmq-namesrv-2:
    image: apache/rocketmq:5.2.0
    container_name: cloudflow-rocketmq-namesrv-2
    restart: always
    environment:
      TZ: Asia/Shanghai
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
    command: sh mqnamesrv
    volumes:
      - rocketmq-namesrv-2-logs:/home/rocketmq/logs
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - cloudflow-prod-net

  rocketmq-broker-master:
    image: apache/rocketmq:5.2.0
    container_name: cloudflow-rocketmq-broker-master
    restart: always
    depends_on:
      - rocketmq-namesrv-1
      - rocketmq-namesrv-2
    ports:
      - "10909:10909"
      - "10911:10911"
    environment:
      TZ: Asia/Shanghai
      NAMESRV_ADDR: "rocketmq-namesrv-1:9876;rocketmq-namesrv-2:9876"
      JAVA_OPT_EXT: "-Xms2g -Xmx2g -Xmn1g"
    command: sh mqbroker -c /home/rocketmq/conf/broker.conf
    volumes:
      - rocketmq-broker-master-data:/home/rocketmq/store
      - rocketmq-broker-master-logs:/home/rocketmq/logs
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
    networks:
      - cloudflow-prod-net

  # ---------------------------------------------------------------------------
  # 4. 夜莺监控平台（生产级）
  # ---------------------------------------------------------------------------
  nightingale:
    image: ccr.ccs.tencentyun.com/nightingale/nightingale:v6.2.0
    container_name: cloudflow-nightingale
    restart: always
    ports:
      - "17000:17000"
    environment:
      TZ: Asia/Shanghai
      GIN_MODE: release
    volumes:
      - nightingale-data:/app/data
      - nightingale-logs:/app/logs
      - ./monitoring/nightingale:/app/etc
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    networks:
      - cloudflow-prod-net

  # ---------------------------------------------------------------------------
  # 5. SkyWalking 链路追踪（生产级）
  # ---------------------------------------------------------------------------
  skywalking-oap:
    image: apache/skywalking-oap-server:9.7.0
    container_name: cloudflow-skywalking-oap
    restart: always
    ports:
      - "11800:11800"
      - "12800:12800"
    environment:
      TZ: Asia/Shanghai
      SW_STORAGE: h2
      SW_HEALTH_CHECKER: default
      JAVA_OPTS: "-Xms2g -Xmx2g"
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
    networks:
      - cloudflow-prod-net

  skywalking-ui:
    image: apache/skywalking-ui:9.7.0
    container_name: cloudflow-skywalking-ui
    restart: always
    depends_on:
      - skywalking-oap
    ports:
      - "18080:8080"
    environment:
      TZ: Asia/Shanghai
      SW_OAP_ADDRESS: http://skywalking-oap:12800
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    networks:
      - cloudflow-prod-net

  # ---------------------------------------------------------------------------
  # 6. Tengine Web 网关
  # ---------------------------------------------------------------------------
  tengine:
    image: alpine/tengine:3.1.0
    container_name: cloudflow-tengine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./web/tengine/nginx.conf:/etc/nginx/nginx.conf
      - ./web/tengine/conf.d:/etc/nginx/conf.d
      - ./web/tengine/certs:/etc/nginx/certs
      - tengine-logs:/var/log/nginx
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    networks:
      - cloudflow-prod-net

  # ---------------------------------------------------------------------------
  # 7. 核心微服务 - 国产化配置
  # ---------------------------------------------------------------------------
  auth-service:
    image: ${DOCKER_REGISTRY:-}cloudflow-auth-service:${VERSION:-latest}
    deploy:
      replicas: ${AUTH_REPLICAS:-2}
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    environment:
      - SERVICE_NAME=auth-service
      - GRPC_ADDR=:9006
      - HTTP_ADDR=:8006
      - DB_TYPE=dameng
      - DB_ADDR=dameng-master:5236
      - DB_USER=SYSDBA
      - DB_PASSWORD=${DAMENG_PASSWORD:?DAMENG_PASSWORD is required}
      - DB_DATABASE=cloudflow_auth
      - REDIS_ADDR=gauss-redis:6379
      - NACOS_ADDR=nacos-1:8848
      - SW_AGENT_NAME=auth-service
      - SW_AGENT_COLLECTOR_BACKEND_SERVICES=skywalking-oap:11800
    restart: always
    networks:
      - cloudflow-prod-net

# =============================================================================
# 数据卷
# =============================================================================
volumes:
  # 数据库
  dameng-master-data:
  gauss-redis-data:

  # Nacos
  nacos-1-data:
  nacos-1-logs:
  nacos-2-data:
  nacos-2-logs:
  nacos-3-data:
  nacos-3-logs:

  # RocketMQ
  rocketmq-namesrv-1-logs:
  rocketmq-namesrv-2-logs:
  rocketmq-broker-master-data:
  rocketmq-broker-master-logs:

  # 夜莺
  nightingale-data:
  nightingale-logs:

  # Tengine
  tengine-logs:

# =============================================================================
# 网络
# =============================================================================
networks:
  cloudflow-prod-net:
    driver: bridge
    name: cloudflow-prod-net
