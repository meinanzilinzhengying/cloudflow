global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: 'cloud-flow'
    env: 'production'

rule_files:
  - 'rules/*.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

scrape_configs:
  # === 基础设施 ===
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # === 存储与中间件 ===
  - job_name: 'tidb'
    static_configs:
      - targets: ['tidb:10080']

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  - job_name: 'victoriametrics'
    static_configs:
      - targets: ['victoriametrics:8428']

  # === CloudFlow 微服务 (需要重新编译部署后生效) ===
  - job_name: 'data-plane'
    static_configs:
      - targets: ['data-plane:9102']
    metrics_path: /metrics

  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:9101']
    metrics_path: /metrics

  - job_name: 'control-plane'
    static_configs:
      - targets: ['control-plane:9101']
    metrics_path: /metrics

  - job_name: 'query-service'
    static_configs:
      - targets: ['query-service:9101']
    metrics_path: /metrics

  - job_name: 'topology-engine'
    static_configs:
      - targets: ['topology-engine:9101']
    metrics_path: /metrics

  - job_name: 'alert-engine'
    static_configs:
      - targets: ['alert-engine:9101']
    metrics_path: /metrics

  - job_name: 'tenant-service'
    static_configs:
      - targets: ['tenant-service:9101']
    metrics_path: /metrics

  # === 服务健康检查 (blackbox) ===
  - job_name: 'service-health'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://auth-service:8006/healthz
          - http://control-plane:8001/healthz
          - http://data-plane:9102/health
          - http://query-service:8007/healthz
          - http://topology-engine:8008/healthz
          - http://alert-engine:8009/healthz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
