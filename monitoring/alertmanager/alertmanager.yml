# =============================================================================
# Alertmanager 配置 - CloudFlow 微服务架构
# =============================================================================
# 注意: YAML 不支持 shell 变量替换 ${VAR:-default}，必须使用字面值
global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alertmanager@cloudflow.local'
  smtp_auth_username: ''
  smtp_auth_password: ''
  smtp_require_tls: true

# 告警路由树
route:
  receiver: 'default'
  group_by: ['alertname', 'cluster', 'service', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      group_wait: 10s
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: 'warning'
      group_wait: 30s
      repeat_interval: 4h

    - match:
        severity: info
      receiver: 'info'
      group_wait: 5m
      repeat_interval: 12h

# 告警接收器
receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://alert-engine:8009/api/v1/alerts/webhook'
        send_resolved: true

  - name: 'critical'
    webhook_configs:
      - url: 'http://alert-engine:8009/api/v1/alerts/webhook'
        send_resolved: true

  - name: 'warning'
    webhook_configs:
      - url: 'http://alert-engine:8009/api/v1/alerts/webhook'
        send_resolved: true

  - name: 'info'
    webhook_configs:
      - url: 'http://alert-engine:8009/api/v1/alerts/webhook'
        send_resolved: true

# 告警抑制规则
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']

  - source_match:
      alertname: 'ServiceDown'
    target_match:
      alertname: 'DiskSpaceLow'
    equal: ['instance']
